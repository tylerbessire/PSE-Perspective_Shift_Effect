- prompt: |
    Analyze the following code snippet and identify all potential bugs, security vulnerabilities, and performance issues:

    ```python
    def process_user_data(user_input):
        data = eval(user_input)
        results = []
        for i in range(len(data)):
            if data[i] != None:
                results.append(data[i] * 2)
        return results
    ```

    Provide: (1) Issue identification, (2) Security risk assessment, (3) Corrected implementation
  reference: |
    Issues Identified:

    1. CRITICAL SECURITY VULNERABILITY: eval() usage
       - Risk: Arbitrary code execution (RCE)
       - Severity: 10/10
       - Allows attacker to execute any Python code

    2. STYLE: Using 'is not' instead of '!=' for None comparison
       - Should use: if data[i] is not None

    3. PERFORMANCE: Inefficient iteration using range(len())
       - Better: Direct iteration over elements

    Corrected Implementation:
    ```python
    import json
    from typing import List, Union

    def process_user_data(user_input: str) -> List[Union[int, float]]:
        try:
            data = json.loads(user_input)
            if not isinstance(data, list):
                raise ValueError("Input must be a JSON array")

            return [item * 2 for item in data if item is not None]
        except json.JSONDecodeError:
            raise ValueError("Invalid JSON format")
    ```

