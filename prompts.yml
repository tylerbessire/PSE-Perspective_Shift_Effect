    5. Implementation considerations (ramp-up, monitoring, rollback criteria)
  reference: |
    # A/B Testing Framework for Recommendation Algorithm

    ## 1. EXPERIMENT DESIGN

    **Hypothesis:**
    The hybrid recommendation algorithm will increase user engagement (click-through rate) by at least 5% compared to the current collaborative filtering algorithm, without degrading revenue or user satisfaction.

    **Groups:**
    - Control (A): Current collaborative filtering (50% of users)
    - Treatment (B): New hybrid algorithm (50% of users)

    **Sample Size Calculation:**
    - Baseline CTR: 3.5% (assumed)
    - Minimum Detectable Effect (MDE): 5% relative increase → 3.675% CTR
    - Power: 80%
    - Significance level: 0.05
    - **Required sample size**: ~450,000 users per group
    - **Daily users available**: 500,000 per group
    - **Experiment duration**: 14 days (for stability and weekly cycles)

    **Randomization Strategy:**
    - User-level randomization (not session-level)
    - Consistent hashing on user_id for stable group assignment
    - Stratified by user segment (new, active, power users) to ensure balance
    - 5% holdout group for long-term effect measurement

    ## 2. KEY METRICS

    **Primary Metric:**
    - **Click-Through Rate (CTR)**: Percentage of recommended items clicked
      - Measurement: (total_clicks / total_impressions) × 100
      - Success criteria: >5% relative improvement

    **Secondary Metrics:**
    - **Add-to-Cart Rate**: Conversion from click to cart addition
    - **Purchase Conversion Rate**: Percentage of clicked recommendations leading to purchase
    - **Average Order Value (AOV)**: Revenue per order
    - **Session Duration**: Time spent on site
    - **Recommendations Shown**: Number of recommendation impressions per user

    **Guardrail Metrics** (must not degrade):
    - **Revenue per User**: Must not decrease >2%
    - **User Satisfaction (NPS)**: Must not decrease
    - **System Latency**: P95 latency <200ms
    - **Bounce Rate**: Must not increase >3%
    - **User Retention (D7)**: Must not decrease

    ## 3. STATISTICAL ANALYSIS

    **Method: Two-Sample T-Test with Bonferroni Correction**

    ```python
    from scipy import stats
    import numpy as np

    def analyze_results(control_ctr, treatment_ctr):
        # T-test
        t_stat, p_value = stats.ttest_ind(control_ctr, treatment_ctr)

        # Confidence interval
        control_mean = np.mean(control_ctr)
        treatment_mean = np.mean(treatment_ctr)
        relative_lift = (treatment_mean - control_mean) / control_mean

        # Bonferroni correction for multiple comparisons
        alpha_corrected = 0.05 / 7  # 7 metrics

        return {
            'control_mean': control_mean,
            'treatment_mean': treatment_mean,
            'relative_lift': relative_lift,
            'p_value': p_value,
            'significant': p_value < alpha_corrected
        }
    ```

    **Sequential Testing (Early Stopping):**
    - Implement sequential probability ratio test (SPRT)
    - Check metrics daily but adjust significance thresholds
    - Allow early stop if clear winner emerges (p < 0.001) after minimum 7 days

    ## 4. GUARDRAIL METRICS & MONITORING

    **Automated Checks:**
