    # Fermi Estimation: Piano Tuners in Chicago

    ## APPROACH: Bottom-Up Estimation

    ### STEP 1: Establish Base Assumptions

    **Population of Chicago:**
    - Assumption: ~3 million people
    - Justification: Major US city, not top 3 but in top 10

    **Household size:**
    - Assumption: 2.5 people per household on average
    - Justification: Mix of families, couples, singles
    - **Calculation**: 3,000,000 / 2.5 = 1,200,000 households

    ### STEP 2: Estimate Number of Pianos

    **Household piano ownership rate:**
    - Assumption: 2% of households own a piano
    - Justification: Pianos are expensive, require space, not universal interest
    - Range: 1-3% (sensitivity analysis)
    - **Calculation**: 1,200,000 × 0.02 = 24,000 household pianos

    **Institutional pianos:**
    - Schools: 500 schools × 1 piano = 500 pianos
    - Concert halls/theaters: 50 venues × 2 pianos = 100 pianos
    - Churches: 1,000 churches × 0.3 = 300 pianos
    - Music schools/studios: 200 × 3 = 600 pianos
    - **Total institutional**: 1,500 pianos

    **Total pianos in Chicago**: 24,000 + 1,500 = **25,500 pianos**

    ### STEP 3: Estimate Tuning Frequency

    **Average tunings per piano per year:**
    - Assumption: 1 tuning per year on average
    - Justification: Professional pianists tune 2-4x/year, casual owners tune every 1-2 years
    - Range: 0.8-1.5 (sensitivity analysis)
    - **Calculation**: 25,500 × 1 = **25,500 tunings per year**

    ### STEP 4: Estimate Tuner Capacity

    **Working days per year:**
    - 52 weeks × 5 days = 260 days
    - Minus holidays/vacation: 260 - 20 = 240 working days

    **Tunings per day:**
    - Assumption: 3 tunings per day
    - Justification: 2 hours per tuning + 1 hour travel/setup = 3 hours per job × 3 = 9-hour day
    - Range: 2-4 tunings per day

    **Tunings per tuner per year:**
    - 240 days × 3 tunings = **720 tunings per year**

    ### STEP 5: Calculate Number of Tuners

    **Required tuners:**
    - 25,500 tunings needed / 720 tunings per tuner
    - **= 35.4 tuners**
    - **Rounded estimate: 35-40 piano tuners in Chicago**

    ## SENSITIVITY ANALYSIS

    **Low estimate** (pessimistic assumptions):
    - 1% piano ownership: 12,000 + 1,500 = 13,500 pianos
    - 0.8 tunings per year: 10,800 tunings needed
    - 4 tunings per day: 960 capacity per tuner
    - **Result**: 10,800 / 960 = **11 tuners**

    **High estimate** (optimistic assumptions):
    - 3% piano ownership: 36,000 + 1,500 = 37,500 pianos
    - 1.5 tunings per year: 56,250 tunings needed
    - 2 tunings per day: 480 capacity per tuner
    - **Result**: 56,250 / 480 = **117 tuners**

    ## FINAL ESTIMATE

    **Point estimate**: 35-40 piano tuners
    **Confidence interval**: 15-80 tuners (80% confidence)
    **Most likely range**: 25-50 tuners

    ## KEY ASSUMPTIONS CRITIQUE

    **Most impactful assumptions:**
    1. Piano ownership rate (2%) - MEDIUM CONFIDENCE
       - Could be lower in apartment-heavy city
       - Could be higher in wealthy neighborhoods

    2. Tunings per year (1) - MEDIUM CONFIDENCE
       - Many pianos go untuned for years
       - Professional/institutional pianos tuned more frequently

    3. Tuner productivity (3/day) - HIGH CONFIDENCE
       - Well-established industry standard
       - Travel time is significant factor

    **Reality Check:**
    - This seems reasonable for a major US city
    - Not so many that market is oversaturated
    - Enough to sustain as a profession with other income sources
    - Actual answer (if Googled): ~50-80 tuners - our estimate is in the ballpark!

    ## LESSONS FROM THIS ESTIMATION

    1. **Break down complex problems** into manageable components
    2. **State assumptions explicitly** - makes reasoning transparent
    3. **Use round numbers** - precision is false in estimates
    4. **Test sensitivity** - understand which assumptions matter most
    5. **Sanity check** - does the answer make intuitive sense?

