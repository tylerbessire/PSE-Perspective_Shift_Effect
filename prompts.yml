    2. Error rate >1% for 3+ minutes
    3. Revenue per user drops >5% (statistically significant)
    4. System crashes or critical bugs

    **Rollback Criteria (Manual Review):**
    1. Revenue per user drops 2-5%
    2. User complaints spike
    3. Unexpected behavior in specific segments
    4. External factors (major competitor move, news event)

    ## 6. ADDITIONAL CONSIDERATIONS

    **Novelty Effect:**
    - Extended measurement period (28 days) for subset of users
    - Compare week 1 vs. week 2 metrics to detect decay

    **Network Effects:**
    - Minimal in recommendations (mostly user-independent)
    - If present, consider cluster randomization

    **Segmented Analysis:**
