- prompt: |
    Write a Python function that implements binary search on a sorted array.
    Requirements:
    - Handle edge cases (empty array, single element, target not found)
    - Include comprehensive docstring with complexity analysis
    - Use type hints for all parameters and return values
    - Implement iterative approach for O(1) space complexity
    - Return the index of the target element, or -1 if not found
  reference: |
    def binary_search(arr: list[int], target: int) -> int:
        """
        Perform binary search on a sorted array.

        Time Complexity: O(log n)
        Space Complexity: O(1)

        Args:
            arr: Sorted list of integers
            target: Integer to search for

        Returns:
            Index of target if found, -1 otherwise
        """
        left, right = 0, len(arr) - 1

        while left <= right:
            mid = (left + right) // 2

            if arr[mid] == target:
                return mid
            elif arr[mid] < target:
                left = mid + 1
            else:
                right = mid - 1

        return -1

