- prompt: |
    A company's customer churn rate increased from 5% to 12% over three months. Available data shows:
    - New pricing introduced 4 months ago (15% increase)
    - Competitor launched similar product 3 months ago at lower price
    - Customer support response time increased from 2 hours to 8 hours
    - Two negative reviews went viral on social media
    - Product feature X (used by 40% of customers) was deprecated

    Use structured analysis to:
    1. Identify likely root causes (with confidence levels)
    2. Distinguish correlation from causation
    3. Propose data-driven validation methods
    4. Recommend prioritized action items
  reference: |
    STRUCTURED ROOT CAUSE ANALYSIS:

    PRIMARY CAUSES (High Confidence - 80-90%):

    1. Feature Deprecation (90% confidence)
       - Evidence: Direct impact on 40% user base
       - Timeline: Aligns with churn increase
       - Validation: Segment churn by feature usage - expect 3x higher churn among Feature X users
       - Mechanism: Clear causation - removed value proposition

    2. Customer Support Degradation (85% confidence)
       - Evidence: 4x increase in response time
       - Impact: Frustration compounds other issues
       - Validation: Correlate support ticket volume with churn timing
       - Mechanism: Poor support prevents issue resolution, accelerates churn

    SECONDARY CAUSES (Medium Confidence - 50-70%):

    3. Competitive Pressure (70% confidence)
       - Evidence: Timing aligns, lower competitor price
       - Validation: Survey churned customers about alternatives; track competitor mentions
       - Note: Likely amplifies other issues rather than sole cause

    4. Viral Negative Reviews (60% confidence)
       - Evidence: Social proof affects perception
       - Validation: Sentiment analysis timeline, new customer acquisition impact
       - Consideration: May reduce new signups more than cause churn

    UNLIKELY PRIMARY CAUSE (Low Confidence - 30%):

    5. Pricing Increase (30% confidence)
       - Evidence: 4-month lag suggests not the primary driver
       - Reasoning: If price was main issue, churn would spike immediately
       - Validation: Segment by plan type/revenue
       - Conclusion: Contributing factor but not root cause

    CORRELATION VS CAUSATION:
    - Pricing: Correlation (timing mismatch)
    - Feature deprecation: Strong causation (direct impact)
    - Support degradation: Likely causation (mechanism clear)
    - Competitor: Mixed (enables churn, doesn't cause it)
    - Reviews: Correlation (amplifier, not initiator)

    VALIDATION METHODS:
    1. Cohort analysis: Compare churn by Feature X usage
    2. Exit surveys: Ask "primary reason for leaving"
    3. Support ticket analysis: Time-to-resolution vs. churn rate
    4. Win-back campaign: Test with feature restoration offer

    PRIORITIZED ACTIONS:
    1. IMMEDIATE (Week 1): Improve support response time to <3 hours
       - Impact: High, Effort: Medium, Time: 2 weeks

    2. URGENT (Week 2): Restore Feature X or provide alternative
       - Impact: Highest, Effort: High, Time: 4-6 weeks

    3. SHORT-TERM (Month 1): Proactive outreach to at-risk customers
       - Impact: Medium, Effort: Low, Time: Ongoing

    4. MEDIUM-TERM (Month 2): Address viral reviews with transparency
       - Impact: Low-Medium, Effort: Low, Time: 2 weeks

    5. EVALUATE (Month 2): Pricing adjustment if data supports
       - Impact: Unknown, Effort: Low, Time: 1 week

    EXPECTED OUTCOME:
    - Actions 1+2 should reduce churn to 7-8% within 2 months
    - Full recovery to 5% requires 3-4 months with sustained effort

