- prompt: |
    Design a data structure that supports the following operations efficiently:
    1. insert(value): Add a value to the collection
    2. remove(value): Remove a value from the collection
    3. getRandom(): Return a random element with uniform probability

    All operations must be O(1) average time complexity. Explain your approach, implementation details, and time/space complexity analysis.
  reference: |
    SOLUTION: HashMap + Dynamic Array Combination

    DATA STRUCTURE:
    ```python
    class RandomizedSet:
        def __init__(self):
            self.values = []  # Dynamic array for O(1) random access
            self.indices = {}  # HashMap: value -> index in array
    ```

    OPERATIONS:

    1. insert(value) - O(1) average:
       - Check if value exists in HashMap
       - If not: append to array, store index in HashMap
       - Return success/failure

    2. remove(value) - O(1) average:
       - Get index from HashMap
       - Swap element with last element in array
       - Update HashMap for swapped element
       - Pop last element from array
       - Remove from HashMap

    3. getRandom() - O(1):
       - Generate random index: random.randint(0, len(values)-1)
       - Return values[index]

    KEY INSIGHT:
    The trick for O(1) removal is swapping with the last element, allowing
    us to delete from the end of the array (O(1)) instead of middle (O(n)).

    COMPLEXITY ANALYSIS:
    - Time: O(1) average for all operations
    - Space: O(n) where n is number of elements
    - HashMap collisions might cause O(n) worst case, but average is O(1)

    TRADE-OFFS:
    - Pros: All operations O(1), simple implementation
    - Cons: Order not preserved, uses extra space for HashMap

- prompt: |
    Implement a least-recently-used (LRU) cache with O(1) get and put operations.
    Requirements:
    - Constructor takes capacity parameter
    - get(key): Return value if key exists, -1 otherwise. Mark as recently used.
    - put(key, value): Insert or update value. If at capacity, evict LRU item.

    Explain data structure choice and provide implementation in Python with type hints.
  reference: |
    SOLUTION: Doubly Linked List + HashMap

    WHY THIS COMBINATION:
    - HashMap: O(1) key lookup
    - Doubly Linked List: O(1) removal and insertion at both ends
    - Together: O(1) for all operations

    STRUCTURE:
    - HashMap: key -> LinkedListNode
    - LinkedList: Most recent (head) to Least recent (tail)

    ```python
    from typing import Optional

    class Node:
        def __init__(self, key: int, value: int):
            self.key = key
            self.value = value
            self.prev: Optional[Node] = None
            self.next: Optional[Node] = None

    class LRUCache:
        def __init__(self, capacity: int):
            self.capacity = capacity
            self.cache: dict[int, Node] = {}
            # Dummy head and tail for easier operations
            self.head = Node(0, 0)
            self.tail = Node(0, 0)
            self.head.next = self.tail
            self.tail.prev = self.head

        def _remove(self, node: Node) -> None:
            """Remove node from linked list."""
            node.prev.next = node.next
            node.next.prev = node.prev

        def _add_to_head(self, node: Node) -> None:
            """Add node right after head (most recent position)."""
            node.next = self.head.next
            node.prev = self.head
            self.head.next.prev = node
            self.head.next = node

        def get(self, key: int) -> int:
            if key not in self.cache:
                return -1

            node = self.cache[key]
            # Move to head (mark as recently used)
            self._remove(node)
            self._add_to_head(node)
            return node.value

        def put(self, key: int, value: int) -> None:
            if key in self.cache:
                # Update existing
                node = self.cache[key]
                node.value = value
                self._remove(node)
                self._add_to_head(node)
            else:
                # Add new
                if len(self.cache) >= self.capacity:
                    # Evict LRU (tail.prev)
                    lru = self.tail.prev
                    self._remove(lru)
                    del self.cache[lru.key]

                new_node = Node(key, value)
                self.cache[key] = new_node
                self._add_to_head(new_node)
    ```

    COMPLEXITY:
    - Time: O(1) for both get and put
    - Space: O(capacity)

