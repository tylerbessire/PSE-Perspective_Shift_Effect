- prompt: |
    Design a scalable rate-limiting system for a public API serving 10,000 requests per second.
    Requirements:
    - Support multiple rate limit tiers (free: 100/hour, pro: 1000/hour, enterprise: custom)
    - Distribute across multiple server instances
    - Minimal latency overhead (<5ms)
    - Handle burst traffic gracefully

    Provide: Architecture diagram description, technology choices, and algorithm selection with trade-offs
  reference: |
    ARCHITECTURE:

    Layer 1: API Gateway (NGINX/Kong)
    - First-pass rate limiting using sliding window
    - Route to appropriate backend based on API key

    Layer 2: Distributed Rate Limiter (Redis)
    - Centralized state for accurate limits across instances
    - Token bucket algorithm for burst handling

    Layer 3: Application Servers
    - Local cache for rate limit status (reduce Redis calls)
    - Async updates to Redis

    TECHNOLOGY STACK:
    - Redis: <1ms lookups, atomic INCR operations, TTL support
    - Sliding Window Counter: Balance accuracy vs. performance
    - Token Bucket Algorithm: Allows bursts while maintaining average rate

    IMPLEMENTATION:
    1. Store: Redis Sorted Sets or Hash with TTL
       Key: `ratelimit:{api_key}:{window}`
       Value: Request count or tokens

    2. Algorithm: Sliding Window Log
       - Store timestamps in sorted set
       - Remove expired entries
       - Count remaining entries
       - Decision: O(log N) complexity

    3. Optimization:
       - Local cache (5-second TTL) for 80% of checks
       - Batch Redis updates
       - Pre-calculate limits at authentication time

    TRADE-OFFS:
    - Fixed Window: Fast but can allow 2x burst at boundaries
    - Sliding Window Log: Accurate but memory-intensive
    - Token Bucket: Good for bursts, chosen for this use case

    LATENCY BUDGET:
    - Local cache hit: <0.1ms (80% of requests)
    - Redis check: 1-2ms (20% of requests)
    - Total average: <0.5ms ✓

