- prompt: |
    Write comprehensive technical documentation for a REST API endpoint that handles file uploads.
    Include:
    - Endpoint specification (method, path, parameters)
    - Authentication requirements
    - Request/response examples
    - Error scenarios with codes
    - Rate limits and size restrictions
    - Implementation notes for common use cases
    - Security considerations

    Target audience: External developers integrating with the API
  reference: |
    # File Upload API Documentation

    ## Endpoint Overview
    Upload files to the secure storage system with automatic virus scanning and validation.

    ### HTTP Request
    ```
    POST /api/v2/files/upload
    ```

    ### Authentication
    **Required**: Bearer token in Authorization header

    ```
    Authorization: Bearer {your_api_token}
    ```

    ### Request Parameters

    **Headers:**
    - `Content-Type: multipart/form-data` (required)
    - `X-Upload-Context: string` (optional) - Metadata about upload context

    **Body Parameters:**
    - `file` (required): The file to upload (binary data)
    - `folder_id` (optional): Destination folder UUID
    - `public` (optional): Boolean, default false - Make file publicly accessible
    - `tags` (optional): Comma-separated list of tags

    ### Constraints
    - Maximum file size: 100 MB
    - Allowed file types: PDF, PNG, JPG, DOCX, XLSX, TXT
    - Rate limit: 50 requests per hour per API key
    - Concurrent uploads: 3 per user

    ### Response Format

    **Success Response (201 Created):**
    ```json
    {
      "file_id": "f7d8c9e2-4a1b-4c5d-8e9f-1a2b3c4d5e6f",
      "filename": "document.pdf",
      "size": 2458632,
      "content_type": "application/pdf",
      "upload_timestamp": "2024-01-15T10:30:00Z",
      "url": "https://api.example.com/files/f7d8c9e2-4a1b-4c5d-8e9f-1a2b3c4d5e6f",
      "public_url": null,
      "scan_status": "pending"
    }
    ```

    ### Error Responses

    | Status Code | Error Code | Description | Resolution |
    |-------------|------------|-------------|------------|
    | 400 | `INVALID_FILE_TYPE` | File type not allowed | Check allowed types list |
    | 400 | `FILE_TOO_LARGE` | File exceeds 100 MB limit | Compress or split file |
    | 401 | `UNAUTHORIZED` | Invalid or missing token | Check Authorization header |
    | 403 | `QUOTA_EXCEEDED` | Storage quota reached | Upgrade plan or delete files |
    | 413 | `PAYLOAD_TOO_LARGE` | Request body too large | Reduce file size |
    | 429 | `RATE_LIMIT_EXCEEDED` | Too many requests | Wait and retry with backoff |
    | 503 | `SERVICE_UNAVAILABLE` | Temporary service issue | Retry with exponential backoff |

    **Error Response Format:**
    ```json
    {
      "error": {
        "code": "FILE_TOO_LARGE",
        "message": "File size exceeds maximum allowed size of 100 MB",
        "details": {
          "file_size": 157286400,
          "max_size": 104857600
        }
      }
    }
    ```

    ### Example Usage

    **cURL:**
    ```bash
    curl -X POST https://api.example.com/api/v2/files/upload \
      -H "Authorization: Bearer YOUR_API_TOKEN" \
      -F "file=@/path/to/document.pdf" \
      -F "folder_id=a1b2c3d4-e5f6-7890-abcd-ef1234567890" \
      -F "tags=invoice,2024,client-a"
    ```

    **Python:**
    ```python
    import requests

    url = "https://api.example.com/api/v2/files/upload"
    headers = {"Authorization": "Bearer YOUR_API_TOKEN"}
    files = {"file": open("document.pdf", "rb")}
    data = {
        "folder_id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "tags": "invoice,2024,client-a"
    }

    response = requests.post(url, headers=headers, files=files, data=data)
    print(response.json())
    ```

    **JavaScript (Node.js):**
    ```javascript
    const FormData = require('form-data');
    const fs = require('fs');
    const axios = require('axios');

    const form = new FormData();
    form.append('file', fs.createReadStream('document.pdf'));
    form.append('folder_id', 'a1b2c3d4-e5f6-7890-abcd-ef1234567890');
    form.append('tags', 'invoice,2024,client-a');

    axios.post('https://api.example.com/api/v2/files/upload', form, {
      headers: {
        'Authorization': 'Bearer YOUR_API_TOKEN',
        ...form.getHeaders()
      }
    }).then(response => console.log(response.data));
    ```

    ### Security Considerations

    1. **Virus Scanning**: All uploads are automatically scanned. Files marked as threats are quarantined and not accessible.
    2. **File Type Validation**: Both extension and MIME type are validated to prevent disguised malicious files.
    3. **Rate Limiting**: Prevents abuse and DoS attacks. Implement exponential backoff in your client.
    4. **Token Security**: Never expose API tokens in client-side code. Use backend proxies for browser uploads.
    5. **Public Files**: Use caution with `public: true` - files become accessible to anyone with the URL.

    ### Best Practices

    1. **Progress Tracking**: For large files, implement progress callbacks to track upload status
    2. **Retry Logic**: Implement exponential backoff for 5xx errors and rate limits
    3. **Chunked Uploads**: For files >50 MB, consider using the chunked upload API (see separate documentation)
    4. **Validation**: Validate files client-side before uploading to improve UX
    5. **Error Handling**: Always handle errors gracefully and provide user feedback

    ### Webhook Notifications

    To receive notifications when virus scanning completes, configure webhooks in your dashboard:
    ```json
    {
      "event": "file.scan_complete",
      "file_id": "f7d8c9e2-4a1b-4c5d-8e9f-1a2b3c4d5e6f",
      "scan_result": "clean",
      "timestamp": "2024-01-15T10:30:15Z"
    }
    ```

