    Design an A/B testing framework for evaluating a new recommendation algorithm.

    Context:
    - E-commerce platform with 1M daily active users
    - Current algorithm: collaborative filtering
    - New algorithm: hybrid (collaborative + content-based + contextual bandit)

    Provide:
