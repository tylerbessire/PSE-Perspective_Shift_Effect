- prompt: |
    Write an optimized SQL query for the following scenario:

    Tables:
    - users (id, email, created_at, country)
    - orders (id, user_id, total_amount, status, order_date)
    - order_items (id, order_id, product_id, quantity, price)

    Task: Find top 10 countries by total revenue in Q1 2024, including:
    - Total revenue
    - Number of unique customers
    - Average order value
    - Order count

    Requirements:
    - Only include completed orders
    - Exclude cancelled/refunded orders
    - Handle NULL values appropriately
    - Optimize for PostgreSQL
    - Include index recommendations
  reference: |
    ```sql
    -- Optimized query with CTE for better readability and performance
    WITH q1_2024_orders AS (
      SELECT
        o.id AS order_id,
        o.user_id,
        o.total_amount,
        u.country
      FROM orders o
      INNER JOIN users u ON o.user_id = u.id
      WHERE o.status = 'completed'
        AND o.order_date >= '2024-01-01'
        AND o.order_date < '2024-04-01'
        AND u.country IS NOT NULL
    )
    SELECT
      country,
      ROUND(SUM(total_amount)::numeric, 2) AS total_revenue,
      COUNT(DISTINCT user_id) AS unique_customers,
      ROUND(AVG(total_amount)::numeric, 2) AS avg_order_value,
      COUNT(order_id) AS order_count
    FROM q1_2024_orders
    GROUP BY country
    ORDER BY total_revenue DESC
    LIMIT 10;
    ```

    **Index Recommendations:**

    ```sql
    -- Critical indexes for optimal performance
    CREATE INDEX idx_orders_status_date ON orders(status, order_date)
      WHERE status = 'completed';

    CREATE INDEX idx_orders_user_id ON orders(user_id);

    CREATE INDEX idx_users_country ON users(country)
      WHERE country IS NOT NULL;

    -- Composite index for covering the join
    CREATE INDEX idx_orders_lookup ON orders(order_date, status, user_id, total_amount);
    ```

    **Performance Optimization Notes:**

    1. **Partial Index**: The WHERE clause on status reduces index size
    2. **Date Range**: Using >= and < instead of BETWEEN for better query plan
    3. **CTE**: Improves readability and allows PostgreSQL to optimize execution
    4. **Covering Index**: idx_orders_lookup includes all needed columns
    5. **INNER JOIN**: More efficient than LEFT JOIN when country is required
    6. **NULL Handling**: Filtered in WHERE clause, not in aggregation

    **Expected Performance:**
    - With indexes: <50ms for millions of rows
    - Without indexes: 2-5 seconds
    - Index size: ~10-15% of table size

    **Alternative Approach (Materialized View for frequent queries):**

    ```sql
    CREATE MATERIALIZED VIEW country_revenue_q1_2024 AS
    SELECT
      u.country,
      SUM(o.total_amount) AS total_revenue,
      COUNT(DISTINCT o.user_id) AS unique_customers,
      AVG(o.total_amount) AS avg_order_value,
      COUNT(o.id) AS order_count
    FROM orders o
    INNER JOIN users u ON o.user_id = u.id
    WHERE o.status = 'completed'
      AND o.order_date >= '2024-01-01'
      AND o.order_date < '2024-04-01'
    GROUP BY u.country;

    -- Refresh daily or as needed
    REFRESH MATERIALIZED VIEW country_revenue_q1_2024;
    ```

